<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111b2c" />
  <meta name="description" content="玩家手册" />
  <title>玩家手册</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <style>
    :root {
      --ink: #1f2937;
      --muted: #667085;
      --paper: rgba(255, 255, 255, 0.94);
      --line: #e2e8f0;
      --accent: #c98d48;
      --accent-deep: #9a6228;
      --night: #101827;
    }
    * { box-sizing: border-box; }
    [v-cloak] { display: none; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% -8%, rgba(201, 141, 72, 0.22), transparent 30rem),
        linear-gradient(180deg, var(--night) 0, #18253a 310px, #edf1f5 310px, #f6f7f9 100%);
      font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.055;
      background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, #000, transparent 420px);
    }
    .app-wrap { position: relative; max-width: 1120px; margin: 0 auto; padding: 54px 24px 64px; }
    .masthead { position: relative; min-height: 156px; padding: 12px 116px 32px 4px; color: #fff; }
    .eyebrow { margin: 0 0 12px; color: #d8ae78; font-size: 12px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; }
    .page-title { margin: 0; font-family: "STKaiti", "KaiTi", serif; font-size: clamp(34px, 5vw, 52px); font-weight: 700; letter-spacing: .08em; line-height: 1.16; }
    .orbit-mark { position: absolute; top: 10px; right: 18px; width: 82px; height: 82px; border: 1px solid rgba(216,174,120,.45); border-radius: 50%; }
    .orbit-mark::before { content: ""; position: absolute; inset: 19px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #f1cf91, #b86f32 45%, #39291f 100%); box-shadow: 0 0 28px rgba(225,154,77,.5); }
    .orbit-mark::after { content: ""; position: absolute; top: 39px; left: -9px; width: 98px; height: 18px; border: 1px solid rgba(216,174,120,.52); border-radius: 50%; transform: rotate(-18deg); }
    .archive-shell { overflow: hidden; border: 1px solid rgba(255,255,255,.7); border-radius: 18px; background: rgba(255,255,255,.72); box-shadow: 0 24px 70px rgba(8,18,35,.17); backdrop-filter: blur(16px); }
    .archive-nav { padding: 10px 12px 0; border-bottom: 1px solid var(--line); background: rgba(248,250,252,.85); }
    .archive-nav .el-tabs__header { margin: 0; border: 0 !important; background: transparent !important; }
    .archive-nav .el-tabs__nav { display: flex; gap: 6px; border: 0 !important; }
    .archive-nav .el-tabs__active-bar, .archive-nav .el-tabs__nav-wrap::after { display: none; }
    .archive-nav .el-tabs__item { height: 48px; padding: 0 20px !important; border: 0 !important; border-radius: 10px 10px 0 0; color: #64748b; font-weight: 600; letter-spacing: .02em; transition: color .2s, background .2s; }
    .archive-nav .el-tabs__item:hover { color: var(--accent-deep); background: rgba(201,141,72,.08); }
    .archive-nav .el-tabs__item.is-active { color: var(--accent-deep); background: #fff; box-shadow: inset 0 -2px var(--accent); }
    .archive-nav .el-tabs__content { display: none; }
    .content-card { border: 0 !important; border-radius: 0 !important; background: var(--paper) !important; }
    .content-card .el-card__body { min-height: 420px; padding: clamp(24px, 5vw, 54px) !important; }
    .doc-content { max-width: 900px; margin: 0 auto; word-break: break-word; color: #344054; font-family: inherit; font-size: 15px; line-height: 1.92; }
    .doc-content > h2:first-child { margin-top: 0; }
    .doc-content h2 { margin: 38px 0 18px; color: #172033; font-family: "STKaiti", "KaiTi", serif; font-size: 28px; letter-spacing: .05em; line-height: 1.35; }
    .doc-content h2::after { content: ""; display: block; width: 42px; height: 2px; margin-top: 11px; background: linear-gradient(90deg, var(--accent), transparent); }
    .doc-content h3 { position: relative; margin: 30px 0 12px; padding-left: 15px; color: #27364b; font-size: 18px; line-height: 1.55; }
    .doc-content h3::before { content: ""; position: absolute; top: .25em; bottom: .25em; left: 0; width: 3px; border-radius: 2px; background: var(--accent); }
    .doc-content p { margin: 9px 0; }
    .doc-content .kv { margin: 10px 0; padding: 10px 13px; border-radius: 8px; background: #f8fafc; }
    .doc-content .key { color: var(--accent-deep); font-weight: 700; }
    .doc-content ul { margin: 12px 0 18px 8px; padding-left: 22px; }
    .doc-content li { margin: 7px 0; padding-left: 4px; }
    .doc-content li::marker { color: var(--accent); }
    .doc-content .spacer { height: 7px; }
    .stone-entry { position: relative; margin: 0 0 16px; padding: 20px 22px 17px; border: 1px solid #e8edf3; border-radius: 12px; background: linear-gradient(135deg, #fff, #fbfcfe); box-shadow: 0 5px 18px rgba(33,49,75,.05); transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .stone-entry:hover { transform: translateY(-2px); border-color: #dbc09e; box-shadow: 0 10px 28px rgba(33,49,75,.09); }
    .stone-entry h3 { margin-top: 0; padding-left: 0; }
    .stone-entry h3::before { display: none; }
    .stone-id { display: inline-flex; align-items: center; justify-content: center; min-width: 60px; height: 26px; padding: 0 10px; margin-right: 10px; border-radius: 999px; color: #fff; background: #253650; font: 700 12px/1 system-ui, sans-serif; vertical-align: 2px; }
    .stone-entry .kv { background: transparent; border-top: 1px dashed #e4e7ec; border-radius: 0; }
    .footer-note { margin: 22px 4px 0; color: #8591a3; font-size: 12px; text-align: center; letter-spacing: .08em; }
    @media (max-width: 720px) {
      body { background: linear-gradient(180deg, var(--night) 0, #18253a 270px, #f4f6f8 270px); }
      .app-wrap { padding: 30px 12px 40px; }
      .masthead { min-height: 144px; padding: 8px 82px 24px 8px; }
      .orbit-mark { right: 4px; width: 64px; height: 64px; }
      .orbit-mark::before { inset: 15px; }
      .orbit-mark::after { top: 30px; width: 76px; height: 15px; }
      .archive-shell { border-radius: 14px; }
      .archive-nav { overflow-x: auto; padding-left: 6px; scrollbar-width: none; }
      .archive-nav::-webkit-scrollbar { display: none; }
      .archive-nav .el-tabs__nav-wrap { overflow: visible; }
      .archive-nav .el-tabs__nav-wrap::after { display: none; }
      .archive-nav .el-tabs__item { height: 46px; padding: 0 14px !important; font-size: 13px; white-space: nowrap; }
      .content-card .el-card__body { padding: 24px 17px !important; }
      .doc-content { font-size: 14px; line-height: 1.85; }
      .doc-content h2 { font-size: 24px; }
      .stone-entry { padding: 17px 14px 14px; }
      .stone-entry .kv { padding-left: 3px; padding-right: 3px; }
    }
    @media (prefers-reduced-motion: reduce) { .stone-entry { transition: none; } }
  </style>
</head>
<body>
  <div id="app" class="app-wrap" v-cloak>
    <header class="masthead">
      <p class="eyebrow">Player Handbook</p>
      <h1 class="page-title">玩家手册</h1>
      <div class="orbit-mark" aria-hidden="true"></div>
    </header>
    <main class="archive-shell">
      <el-tabs class="archive-nav" v-model="activeTab" @tab-change="loadDoc">
        <el-tab-pane label="艾恩石图鉴" name="res"></el-tab-pane>
        <el-tab-pane label="夏-图尔遗迹" name="ruin"></el-tab-pane>
        <el-tab-pane label="玩家指南" name="guide"></el-tab-pane>
        <el-tab-pane label="改动日志" name="changelog"></el-tab-pane>
      </el-tabs>
      <el-card class="content-card" shadow="never">
        <el-skeleton v-if="loading" :rows="8" animated></el-skeleton>
        <el-alert v-else-if="error" :title="error" type="error" :closable="false" show-icon></el-alert>
        <div v-else class="doc-content" aria-live="polite" v-html="formattedDoc"></div>
      </el-card>
    </main>
    <p class="footer-note">ASTRAL ARCHIVE · PERSONAL CAMPAIGN RECORDS</p>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
  <script>
    const DOC_FILES = {
      res: "./content/艾恩石图鉴.json",
      resSource: "./source/艾恩石图鉴.json",
      ruin: "./content/夏-图尔遗迹.md",
      guide: "./content/玩家指南.md",
      changelog: "./content/改动日志.md"
    };

    const app = Vue.createApp({
      data() {
        return { docs: {}, activeTab: "res", loading: false, error: "" };
      },
      computed: {
        formattedDoc() {
          if (this.activeTab === "res") return this.renderResources(this.docs.res || []);
          return this.renderDoc(this.docs[this.activeTab] || "");
        }
      },
      methods: {
        async loadDoc(name) {
          const key = name || this.activeTab;
          if (this.docs[key]) return;
          this.loading = true;
          this.error = "";
          try {
            if (key === "res") {
              const [sourceResp, visibilityResp] = await Promise.all([
                fetch(DOC_FILES.resSource, { cache: "no-cache" }),
                fetch(DOC_FILES.res, { cache: "no-cache" })
              ]);
              if (!sourceResp.ok || !visibilityResp.ok) throw new Error("load failed");

              const sourceItems = await sourceResp.json();
              const visibilityRules = await visibilityResp.json();
              const sourceById = new Map(sourceItems.map((item) => [item.id, item]));
              const fields = ["name", "trueName", "effect", "resonance", "attunement"];
              this.docs.res = visibilityRules.map((rule) => {
                const sourceItem = sourceById.get(rule.id);
                if (!sourceItem) return null;
                const item = { id: sourceItem.id };
                fields.forEach((field) => {
                  item[field] = rule[field] === true ? sourceItem[field] : null;
                });
                return item;
              }).filter(Boolean);
              return;
            }

            const resp = await fetch(DOC_FILES[key], { cache: "no-cache" });
            if (!resp.ok) throw new Error("load failed");
            this.docs[key] = await resp.text();
          } catch (e) {
            this.error = `文档加载失败：${DOC_FILES[key]}`;
          } finally {
            this.loading = false;
          }
        },
        escapeHtml(text) {
          return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        },
        renderResources(items) {
          if (!Array.isArray(items) || !items.length) return "<p>暂无可显示的资源数据。</p>";
          const formatBlock = (text) => {
            const raw = (text ?? "").toString();
            if (!raw.trim()) return "？";
            return this.escapeHtml(raw.trim()).replace(/\n/g, "<br>");
          };
          return items.map((item) => {
            const id = Number.isFinite(item.id) ? item.id : "?";
            const namePart = item.name !== null ? formatBlock(item.name) : "";
            const trueNameRaw = item.trueName !== null ? (item.trueName ?? "").toString().trim() : "";
            const trueNamePart = trueNameRaw ? `『${this.escapeHtml(trueNameRaw)}』` : "";
            const effectPart = item.effect !== null ? `<p class="kv"><span class="key">效果：</span>${formatBlock(item.effect)}</p>` : "";
            const resonancePart = item.resonance !== null ? `<p class="kv"><span class="key">共振：</span>${formatBlock(item.resonance)}</p>` : "";
            const attunementPart = item.attunement !== null ? `<p class="kv"><span class="key">调谐：</span>${formatBlock(item.attunement)}</p>` : "";
            return `<section class="stone-entry"><h3><span class="stone-id">NO. ${id}</span>${namePart}${trueNamePart}</h3>${effectPart}${resonancePart}${attunementPart}</section>`;
          }).join("");
        },
        cleanInline(text) {
          return this.escapeHtml(
            text.replace(/&emsp;/g, " ").replace(/`([^`]+)`/g, "$1").replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\*([^*]+)\*/g, "$1").trim()
          );
        },
        renderDoc(text) {
          const lines = text.split(/\r?\n/);
          const html = [];
          let inList = false;
          const closeList = () => { if (inList) { html.push("</ul>"); inList = false; } };

          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line) { closeList(); html.push('<div class="spacer"></div>'); continue; }
            if (/^#{1}\s+/.test(line)) { closeList(); html.push(`<h2>${this.cleanInline(line.replace(/^#{1}\s+/, ""))}</h2>`); continue; }
            if (/^#{2}\s+/.test(line)) { closeList(); html.push(`<h3>${this.cleanInline(line.replace(/^#{2}\s+/, ""))}</h3>`); continue; }

            const kvMatch = line.match(/^\*\*([^*]+)：\*\*\s*(.*)$/);
            if (kvMatch) {
              closeList();
              html.push(`<p class="kv"><span class="key">${this.cleanInline(kvMatch[1])}：</span>${this.cleanInline(kvMatch[2])}</p>`);
              continue;
            }

            const listMatch = line.match(/^\*\s+(.+)$/);
            if (listMatch) {
              if (!inList) { html.push("<ul>"); inList = true; }
              html.push(`<li>${this.cleanInline(listMatch[1])}</li>`);
              continue;
            }

            closeList();
            html.push(`<p>${this.cleanInline(line)}</p>`);
          }

          closeList();
          return html.join("");
        }
      },
      mounted() {
        this.loadDoc("res");
      }
    });

    app.use(ElementPlus);
    app.mount("#app");
  </script>
</body>
</html>
